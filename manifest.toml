#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "filebrowser-quantum"
name = "FileBrowser Quantum"
description.en = "Web File Browser"
description.fr = "Navigateur de fichiers Web"

version = "1.5.6~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
admindoc = "https://filebrowserquantum.com/en/docs/getting-started/linux/"
code = "https://github.com/gtsteffaniak/filebrowser"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "100M"
ram.build = "100M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    rename = "filebrowser"
    extract = false
    amd64.url = "https://github.com/gtsteffaniak/filebrowser/releases/download/v1.5.6-stable/linux-amd64-filebrowser"
    amd64.sha256 = "febf1ded3368eac1f13481f413db272c57678b70f09e74f5513d5e25e0bfb0e5"
    arm64.url = "https://github.com/gtsteffaniak/filebrowser/releases/download/v1.5.6-stable/linux-arm64-filebrowser"
    arm64.sha256 = "0ad12910ffe51bc3ad06096af9559147f1126d074ed5c8a1afdf81ae5d7ebf24"
    armhf.url = "https://github.com/gtsteffaniak/filebrowser/releases/download/v1.5.6-stable/linux-armv7-filebrowser"
    armhf.sha256 = "241892814f854d12b6143edc811d48be561b18eb3777683b60615898c3ce6bfd"
    autoupdate.strategy = "latest_github_release"
    autoupdate.version_regex = "v(\\d+\\.\\d+\\.\\d+)-stable"
    autoupdate.asset.amd64 = "linux-amd64-filebrowser"
    autoupdate.asset.arm64 = "linux-arm64-filebrowser"
    autoupdate.asset.armhf = "linux-armv7-filebrowser"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "ffmpeg"
